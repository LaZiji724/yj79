<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* YJ79 数据层：布局常量 + 传动比（3D 与运动简图共用）
   世界坐标(mm)：X 向右前(屏幕右下)，Y 向右后(屏幕右上)，Z 向上，右手系 */
const YJ = (() => {
  const P = {}; // 几何/齿数常量
  P.m = 2.5;
  // 轴线：axis 方向 + 通过点
  P.I   = {ax:'X', Y:26,    Z:-6};
  P.II  = {ax:'X', Y:-50.4, Z:70.4};
  P.III = {ax:'Y', X:-175,  Z:70.4};
  P.W   = {ax:'Z', X:-135,  Y:69.6};
  P.IV  = {ax:'X', Y:69.6,  Z:210};
  P.VI  = {ax:'X', Y:69.6,  Z:60};
  P.VII = {ax:'X', Y:69.6,  Z:130};            // 箱体内蜗杆轴(随箱体上下)
  P.S   = {ax:'Z', X:60,    Y:109.6};          // 插齿刀主轴
  P.C   = {ax:'Y', X:60,    Z:380};            // 曲柄轴
  P.M   = {ax:'X', Y:176,   Z:-165};           // 电机轴
  P.T   = {ax:'X', Y:260,   Z:-55};            // 链19从动轴(伸缩轴一端)
  // 齿数 / 半径
  P.z = {z3:48, z4:24, z5:24, z7w:20, z8:24, z9a:75, z9b:45, zsp:20, zc:20, zw:40, ztw:40};
  P.r = {P1:20, P2:60, F:34, z3:72, z4:36, b5:34, worm7:15, ww:25, b8:30,
         z9a:93.75, z9b:56.25, S11:24, worm11:15, sp:25, cutter:25, work:50,
         S10a:36, S10b:36, S19a:50, S19b:30, worm22:15, tw:50};
  P.stroke = {e:12, L:150, Zrod0:230, boxZ0:130};
  P.feed = {a0:82, amp:6.15, e:5, kLever:1.23};
  P.cutterZ0 = -20; P.blankTop = -18;
  P.cx = 60;   // 刀/坯 X
  P.Yc0 = P.S.Y; // 刀 Y

  // ===== 传动比：以电动机转角 φM 为基准，其余 = k × φM（绕各自 +轴方向，右手）=====
  const k = {};
  k.M = 1;                                   // 电机轴、小带轮 1
  k.I = k.M * P.r.P1 / P.r.P2;               // 带传动，同向
  k.II = -k.I * P.z.z3 / P.z.z4;             // 外啮合圆柱齿轮，反向
  k.III = -k.II;                             // 等径锥齿轮(两轴矢量均指向齿轮体)：反向
  // 蜗杆7(轴Y,右旋) → 蜗轮(轴Z,位于蜗杆+X侧)：s=sign(nw·(nwh×c)) = Y·(Z×X)=+1
  k.W = k.III * (1 / P.z.z7w);
  // 蜗轮轴W(+Z) → 8b(体向-Z) → 8a(体向+X) 轴IV
  k.IV = k.W;                                // 推导见说明：ω_IV=+ω_W
  k.S10b = k.III * P.r.S10a / P.r.S10b;      // 链10 同向(轴均沿 Y)
  k.C = k.S10b;
  k.VI = -k.IV * P.z.z9a / P.z.z9b;          // 挂轮 9a→9b 外啮合
  k.VII = k.VI;                              // 链11，同向
  // 蜗杆11(轴X,右旋) → 蜗轮(轴Z,位于蜗杆+Y侧)：Z×Y=-X → s=-1
  k.SP = -k.VII / P.z.zsp;
  k.T = k.IV * P.r.S19a / P.r.S19b;          // 链19，同向
  // 蜗杆22(轴X)→ 工作台蜗轮(轴Z,位于蜗杆-Y侧): c=-Y → Z×(-Y)=+X → s=+1(右旋)
  k.TBraw = k.T / P.z.ztw;                    // 右旋蜗杆22时工作台的转角系数
  k.table = k.SP * -P.z.zc / P.z.zw;          // 范成条件：工作台与刀反向，转速比 zc/zw
  k.sign22 = Math.sign(k.table / k.TBraw);    // +1 右旋 / -1 左旋
  YJ_check = {rawTable: k.TBraw, table: k.table, ratio: k.table / k.TBraw};
  k.crank = k.C; k.feedCrank = k.T;
  return {P, k, check: YJ_check};
})();
var YJ_check;
/* 零件注册表：id、名称、类型、所属运动部分 */
YJ.SEC = {pub:'公共传动部分', gen:'范成运动', cut:'切削运动', feed:'进给运动'};
YJ.PARTS = [
 ['1','电动机(含小带轮)','电动机','pub'],
 ['2','V带及大带轮(Ⅰ轴)','带传动','pub'],
 ['F','飞轮','飞轮','pub'],
 ['3','大圆柱齿轮(Ⅰ轴)','圆柱齿轮','pub'],
 ['4','小圆柱齿轮(Ⅱ轴)','圆柱齿轮','pub'],
 ['5','锥齿轮副(5a在Ⅱ轴,5b在Ⅲ轴)','锥齿轮','pub gen cut feed'],
 ['6','Ⅲ轴(带支架)','轴','pub gen cut feed'],
 ['7','蜗杆(Ⅲ轴)','蜗杆','gen feed'],
 ['7w','蜗轮(W轴)','蜗轮','gen feed'],
 ['8','锥齿轮副(W轴/Ⅳ轴)','锥齿轮','gen feed'],
 ['9','挂轮9a/9b','圆柱齿轮','gen'],
 ['10','链传动10(Ⅲ轴→曲柄轴)','链传动','cut'],
 ['11','链11+箱内蜗杆11','链传动/蜗杆','gen'],
 ['12','曲柄及连杆','曲柄连杆','cut'],
 ['13','刀架箱体(上下往复)','滑块','cut gen'],
 ['14','插齿刀(刀轴)','插齿刀','gen cut'],
 ['15','轮坯(工作台)','工件','gen'],
 ['C','工作台滑板','滑板','feed gen'],
 ['16','推杆滚子','推杆','feed'],
 ['17','摇杆支点立柱','机架','feed'],
 ['18','摇杆','摇杆','feed'],
 ['19','链传动19(Ⅳ轴→伸缩轴)','链传动','gen feed'],
 ['20','连杆','连杆','feed'],
 ['21','伸缩传动轴/曲柄','轴','gen feed'],
 ['22','工作台蜗杆','蜗杆','gen'],
 ['23','回位弹簧','弹簧','feed'],
];

/* three.js 辅助：世界(X,Y,Z右手,Z上) → three(x,y,z)=(X,Z,-Y) */
const T3 = THREE;
const W = (X,Y,Z) => new T3.Vector3(X, Z, -Y);
const AX = {X:new T3.Vector3(1,0,0), Y:new T3.Vector3(0,0,-1), Z:new T3.Vector3(0,1,0)};
const PAL = {steel:0x8f989f, dark:0x39414a, green:0x7fa88c, brass:0xb98a4a, red:0xb5483f, rubber:0x20262c, chain:0x6b7480, cast:0x9db8a4, blank:0xc9b37a};
const Q0 = new T3.Quaternion();
const meshes = [];                      // 所有可着色网格
function mat(color, o={}) { return new T3.MeshStandardMaterial(Object.assign({color, roughness:.55, metalness:.35, flatShading:true}, o)); }
function reg(mesh, parts, color) { mesh.userData.parts = [].concat(parts); mesh.userData.base = color; meshes.push(mesh); return mesh; }
function add(g, geo, color, parts, pos, rot) {
  const m = reg(new T3.Mesh(geo, mat(color)), parts, color);
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
  g.add(m); return m;
}
/* 旋转体：root 的局部 +z 对准 axis(dir=-1 则反向)，spin 绕局部 z 转动 */
const bodies = [];
function body(scene, id, axis, c, kk, dir=1) {
  const root = new T3.Group(); root.position.copy(W(c[0],c[1],c[2]));
  const a = AX[axis].clone().multiplyScalar(dir);
  root.quaternion.setFromUnitVectors(new T3.Vector3(0,0,1), a);
  const spin = new T3.Group(); root.add(spin); scene.add(root);
  const b = {root, spin, k:kk, dir, phase:0, id}; bodies.push(b); return b;
}
/* 圆柱齿轮/链轮轮廓：z 个齿，节圆半径 rp，模数 m */
function gearGeo(z, rp, w, m=2.5) {
  const ra = rp + m, rf = rp - 1.25*m, p = 2*Math.PI/z, s = new T3.Shape();
  for (let i=0;i<z;i++) {
    const a = i*p;
    [[rf,-.26],[ra,-.12],[ra,.12],[rf,.26]].forEach(([r,f],j)=>{
      const x = r*Math.cos(a+f*p), y = r*Math.sin(a+f*p);
      (i===0&&j===0) ? s.moveTo(x,y) : s.lineTo(x,y);
    });
  }
  s.closePath();
  const g = new T3.ExtrudeGeometry(s,{depth:w,bevelEnabled:false});
  g.translate(0,0,-w/2); return g;
}
function cyl(r, h, seg=24) { const g = new T3.CylinderGeometry(r,r,h,seg); g.rotateX(Math.PI/2); return g; } // 沿 z
/* 轴：沿局部 z 从 z0 到 z1，带键条以显示转动 */
function shaftMesh(b, r, z0, z1, parts, color=PAL.steel) {
  const h = z1-z0, m = add(b.spin, cyl(r,h,16), color, parts, [0,0,(z0+z1)/2]);
  const key = add(b.spin, new T3.BoxGeometry(r*.5, r*.5, h*.98), PAL.brass, parts, [r,0,(z0+z1)/2]);
  return m;
}
function marker(b, r, z, parts) { return add(b.spin, new T3.SphereGeometry(2.4,10,8), PAL.red, parts, [r*.72,0,z]); }
function spurBody(scene, id, axis, c, kk, z, rp, w, parts, color=PAL.steel, m=2.5) {
  const b = body(scene, id, axis, c, kk);
  add(b.spin, gearGeo(z, rp, w, m), color, parts);
  add(b.spin, cyl(Math.min(rp*.35,14), w+8, 16), PAL.dark, parts);
  marker(b, rp, w/2+0.5, parts); b.z = z; b.rp = rp; return b;
}
/* 锥齿轮：apex 在局部 z=0，向 +z 张开，大端在 z=h */
function bevelBody(scene, id, axis, apex, kk, r, parts, dir=1, z=24) {
  const b = body(scene, id, axis, apex, kk, dir), h = r;
  const cone = new T3.CylinderGeometry(r*.97, 1.5, h, 36, 1, true); cone.rotateX(Math.PI/2); cone.translate(0,0,h/2);
  const m1 = add(b.spin, cone, PAL.steel, parts); m1.material.side = T3.DoubleSide;
  add(b.spin, gearGeo(z, r, 7, 2*r/z), PAL.steel, parts, [0,0,h-3.5]);
  add(b.spin, cyl(9, h*.6, 14), PAL.dark, parts, [0,0,h+h*.2]);
  marker(b, r, h-1, parts); return b;
}
/* 两点之间的杆(圆柱，随帧调整) */
function rodBetween(mesh, p, q) {
  const d = new T3.Vector3().subVectors(q,p), L = d.length();
  mesh.position.copy(p).addScaledVector(d,.5);
  mesh.scale.set(1, L, 1);
  mesh.quaternion.setFromUnitVectors(new T3.Vector3(0,1,0), d.normalize());
}
function rod(scene, r, color, parts) {
  const m = reg(new T3.Mesh(new T3.CylinderGeometry(r,r,1,12), mat(color)), parts, color); scene.add(m); return m;
}
/* 链/带环路：两圆(轴向平面坐标 u,v)，外公切线，逆时针(绕 +轴)参数化 */
const PLANE = {X:(Y,Z)=>[Y,Z], Y:(X,Z)=>[Z,X], Z:(X,Y)=>[X,Y]};   // (u,v) 使 u×v = +轴
function loopGeom(a, b, ra, rb) {
  const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy), th=Math.atan2(dy,dx), be=Math.acos((ra-rb)/L);
  const t = Math.sqrt(L*L-(ra-rb)**2), arcA=2*Math.PI-2*be, arcB=2*be;
  return {a,b,ra,rb,th,be,t,arcA,arcB,len:2*t+ra*arcA+rb*arcB};
}
function seg(c, r, n, s) { const d=n+Math.PI/2; return [c[0]+r*Math.cos(n)+s*Math.cos(d), c[1]+r*Math.sin(n)+s*Math.sin(d), d]; }
function loopAt(g, s) {            // 返回 [u,v,切线角]
  s = ((s%g.len)+g.len)%g.len;
  const {a,b,ra,rb,th,be,t,arcA,arcB} = g, n1=th-be, n2=th+be;
  if (s < t) return seg(a,ra,n1,s);
  s -= t;
  if (s < rb*arcB) { const q=n1+s/rb; return [b[0]+rb*Math.cos(q), b[1]+rb*Math.sin(q), q+Math.PI/2]; }
  s -= rb*arcB;
  if (s < t) return seg(b,rb,n2,s);
  s -= t; const q=n2+s/ra; return [a[0]+ra*Math.cos(q), a[1]+ra*Math.sin(q), q+Math.PI/2];
}

/* 装配辅助 */
function angleOf(b, d) {               // 世界方向 d 绕本体轴(局部+z)相对局部 x 的夹角
  const lx = new T3.Vector3(1,0,0).applyQuaternion(b.root.quaternion);
  const a3 = new T3.Vector3(0,0,1).applyQuaternion(b.root.quaternion);
  const d3 = W(d[0],d[1],d[2]).normalize();
  return Math.atan2(a3.dot(new T3.Vector3().crossVectors(lx,d3)), lx.dot(d3));
}
function meshPair(b1, b2, d) {         // d: 世界方向，由 b1 指向 b2；b1 齿对准啮合点，b2 齿槽对准
  b1.phase = angleOf(b1, d);
  b2.phase = angleOf(b2, [-d[0],-d[1],-d[2]]) - Math.PI/b2.z;
}
function helixWorm(b, rp, len, lead, rh, parts, zc) {
  const pts = [], turns = len/lead, n = Math.ceil(turns*18);
  for (let i=0;i<=n;i++) { const t=i/n*turns, a=2*Math.PI*t*(rh?1:-1);
    pts.push(new T3.Vector3((rp+1)*Math.cos(a), (rp+1)*Math.sin(a), zc-len/2+t*lead)); }
  add(b.spin, new T3.TubeGeometry(new T3.CatmullRomCurve3(pts), n, 3.2, 8, false), PAL.steel, parts);
  add(b.spin, cyl(rp-1.5, len, 20), PAL.dark, parts, [0,0,zc]);
}
function makeLoop(scene, axis, fixed, rA, rB, pitch, w, color, parts, stripe) {
  const g0 = loopGeom([0,0],[100,0],rA,rB);   // 仅用于估算链节数，更新时按实际中心距取链长
  const ms = [];
  return {init(A,B) {
    const N = Math.max(10, Math.round(loopGeom(A,B,rA,rB).len/pitch));
    for (let i=0;i<N;i++) {
      const m = reg(new T3.Mesh(new T3.BoxGeometry(pitch*.82, stripe?3:4.5, w), mat(stripe&&i%2 ? PAL.dark : (i%2? PAL.dark: color))), parts, color);
      m.matrixAutoUpdate = true; scene.add(m); ms.push(m);
    }
  }, update(A, B, s) {
    const g = loopGeom(A,B,rA,rB), N = ms.length;
    for (let i=0;i<N;i++) {
      const [u,v,ang] = loopAt(g, s + i*g.len/N), c=Math.cos(ang), d=Math.sin(ang);
      const Pw = axis==='X'?[fixed,u,v]: axis==='Y'?[v,fixed,u]:[u,v,fixed];
      const Tg = axis==='X'?[0,c,d]: axis==='Y'?[d,0,c]:[c,d,0];
      const t3 = W(...Tg).normalize(), a3 = AX[axis];
      ms[i].position.copy(W(...Pw));
      ms[i].quaternion.setFromRotationMatrix(new T3.Matrix4().makeBasis(t3, new T3.Vector3().crossVectors(a3,t3), a3));
    }
  }};
}
function coilMesh(r, len, turns, parts) {
  const pts=[], n=turns*16;
  for (let i=0;i<=n;i++){const t=i/n*turns,a=2*Math.PI*t; pts.push(new T3.Vector3(r*Math.cos(a), r*Math.sin(a), t/turns*len));}
  return reg(new T3.Mesh(new T3.TubeGeometry(new T3.CatmullRomCurve3(pts), n, 1.4, 6, false), mat(0xc8a64a)), parts, 0xc8a64a);
}

/* 国标机构运动简图（GB/T 4460）：由 YJ.P 的布局常量按正投影生成，与 3D 模型一一对应 */
const DWG = (() => {
  const P = YJ.P, k = YJ.k, r = P.r, Yc0 = P.Yc0 + P.feed.a0;
  const f = n => (Math.round(n*10)/10);
  const VIEW = {
    front:{P:(s,ox,oy)=>(X,Y,Z)=>[ox+s*X, oy-s*Z], dir:{X:[1,0],Y:null,Z:[0,-1]}, sv:{Y:-1}},
    top:  {P:(s,ox,oy)=>(X,Y,Z)=>[ox+s*X, oy-s*Y], dir:{X:[1,0],Y:[0,-1],Z:null}, sv:{Z:1}},
    left: {P:(s,ox,oy)=>(X,Y,Z)=>[ox+s*Y, oy-s*Z], dir:{X:null,Y:[1,0],Z:[0,-1]}, sv:{X:1}},
  };
  const SECOL = {pub:'var(--pub)', gen:'var(--gen)', cut:'var(--cut)', feed:'var(--feed)'};
  function V(type, s, ox, oy, col) {
    const vw = VIEW[type], p = vw.P(s,ox,oy), o = [];
    const A = (...x) => p(...x);
    const push = x => o.push(x);
    const ln = (a,b,c='t',ex='') => { const [x1,y1]=a,[x2,y2]=b; push(`<line class="${c}" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" ${ex}/>`); };
    const txt = (x,y,t,c='tx',anc='middle') => push(`<text class="${c}" x="${f(x)}" y="${f(y)}" text-anchor="${anc}">${t}</text>`);
    const dirOf = ax => vw.dir[ax];
    const perp = d => [-d[1], d[0]];
    const api = {p, s, o, push, ln, txt};
    // 轴(在图面内)：粗实线 + 两端向心轴承符号
    api.shaft = (a, b, ax, noB) => { const pa=A(...a), pb=A(...b), d=dirOf(ax); ln(pa,pb,'sh');
      if (!noB && d) { const n=perp(d); [pa,pb].forEach(q => ln([q[0]-n[0]*7,q[1]-n[1]*7],[q[0]+n[0]*7,q[1]+n[1]*7],'t')); } };
    api.end = c => { const q=A(...c); push(`<circle class="sh0" cx="${f(q[0])}" cy="${f(q[1])}" r="4"/><circle class="dot" cx="${f(q[0])}" cy="${f(q[1])}" r="1.3"/>`); };
    api.cl = (a,b) => ln(A(...a),A(...b),'cl');
    // 圆柱齿轮/带轮/链轮：轴在图面内 → 垂直于轴的细长矩形；轴垂直图面 → 节圆
    api.gear = (ax, c, rm, kind='g', z) => { const q=A(...c), d=dirOf(ax), R=rm*s;
      if (!d) { push(`<circle class="${kind==='g'?'cl':'t'}" cx="${f(q[0])}" cy="${f(q[1])}" r="${f(R)}"/>`); if (z) txt(q[0],q[1]+R+11,'z='+z,'tx s'); return; }
      const n=perp(d), w=kind==='b'?9:6, ang=Math.atan2(d[1],d[0])*180/Math.PI;
      push(`<g transform="translate(${f(q[0])} ${f(q[1])}) rotate(${f(ang)})"><rect class="t" x="${-w/2}" y="${f(-R)}" width="${w}" height="${f(2*R)}"/>${kind==='c'?`<path class="t" d="M${-w/2} ${f(-R)}v${f(2*R)}" stroke-dasharray="2 2"/>`:''}${kind==='b'?`<path class="t" d="M-2.5 ${f(-R)}l2.5 5l2.5 -5M-2.5 ${f(R)}l2.5 -5l2.5 5"/>`:''}</g>`);
      if (z) txt(q[0]+n[0]*(R+12)+(d[0]?0:0), q[1]+n[1]*(R+12)+4, 'z='+z, 'tx s'); };
    // 锥齿轮：顶点 apex，向 axis 方向(dirSign=±1)伸出 h=半径(等径)
    api.bevel = (ax, apex, rm, sign=1) => { const d=dirOf(ax), R=rm*s;
      if (!d) { const q=A(...apex); push(`<circle class="t" cx="${f(q[0])}" cy="${f(q[1])}" r="${f(R)}" stroke-dasharray="4 2"/>`); return; }
      const a=A(...apex), n=perp(d), b=[a[0]+d[0]*R*sign, a[1]+d[1]*R*sign];
      push(`<path class="t" d="M${f(a[0])} ${f(a[1])}L${f(b[0]+n[0]*R)} ${f(b[1]+n[1]*R)}L${f(b[0]-n[0]*R)} ${f(b[1]-n[1]*R)}Z"/>`);
      ln([b[0]+n[0]*R,b[1]+n[1]*R],[b[0]-n[0]*R,b[1]-n[1]*R],'t'); };
    // 蜗杆(轴在图面内：矩形+斜线；垂直图面：圆内加螺旋示意)
    api.worm = (ax, c, len, rm) => { const q=A(...c), d=dirOf(ax), R=rm*s;
      if (!d) { push(`<circle class="t" cx="${f(q[0])}" cy="${f(q[1])}" r="${f(R)}"/><circle class="t" cx="${f(q[0])}" cy="${f(q[1])}" r="${f(R*.45)}"/><path class="t" d="M${f(q[0]-R)} ${f(q[1])}a${f(R)} ${f(R)} 0 0 1 ${f(R)} ${f(-R)}" />`); return; }
      const L=len*s, ang=Math.atan2(d[1],d[0])*180/Math.PI, n=4;
      let sl=''; for (let i=1;i<n;i++) sl+=`<line class="t" x1="${f(-L/2+L*i/n-3)}" y1="${f(R)}" x2="${f(-L/2+L*i/n+3)}" y2="${f(-R)}"/>`;

    zig(v,[130,Yc-70,0],[130,Yc-115,0]); v.hatch([130,Yc-118,0],0);
    dbl(v,[-45,Yc-20,0],[-45,Yc+20,0]); v.name([-45,Yc,0],-8,4,'进给 ±'+P.feed.amp.toFixed(1)+' mm','end');
    v.rot([60,Yc,0],'Z',k.table,22); v.rot([cx,YT,0],'X',0,1);
    [['5',[P.III.X+20,P.II.Y,0],-8,-34],['7',[P.III.X,P.IV.Y,0],-36,-6],['7w',[P.W.X,P.IV.Y,0],-4,-40],['8',[P.W.X+20,P.IV.Y,0],30,28],['19',[250,(P.IV.Y+YT)/2,0],34,0],
     ['21',[cx,YT,0],-34,10],['20',[cx,(YT+Yp)/2,0],-30,4],['18',[190,Yp,0],0,-26],['17',[230,Yp,0],24,-22],['16',[100,Yp,0],-24,-18],['23',[130,Yc-90,0],30,0],['15',[60,Yc,0],56,-18],['22',[57,Yc+65,0],-26,24]]
     .forEach(a => v.num(a[1],a[2],a[3],a[0]));
    v.name([60,Yc+r.work+14,0],-95,-60,'滑板沿Y往复','middle');
    return {w:600,h:470,body:v.html(),cap:'俯视图(沿−Z看，X向右、Y向上)：Ⅳ轴→链19→伸缩轴21→曲柄21→连杆20→摇杆18(绕立柱17)→滚子16推动滑板，弹簧23回位，工作台沿Y往复进给。'};
  };
})();

/* 页面逻辑：场景、相机、分段高亮、标签、动画 */
(function(){
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false, preserveDrawingBuffer:true});
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(32, 1, 10, 6000);
scene.add(new T3.HemisphereLight(0xffffff, 0x445566, .9));
const dl = new T3.DirectionalLight(0xffffff, .9); dl.position.set(600,900,500); scene.add(dl);
const machine = buildMachine(scene);
const SECCOL = {pub:0xd9a21b, gen:0x1f9e8f, cut:0xd1495b, feed:0x6a5acd};
const secOf = {}; YJ.PARTS.forEach(p => secOf[p[0]] = p[3].split(' '));
const state = {sec:'all', phi:0, speed:1, playing:true, labels:true, view:{th:Math.PI*0.25, ph:1.0, d:1500, tx:60, ty:110, tz:120}};
const VIEWS = {iso:{th:Math.PI/4, ph:1.0, d:1550}, front:{th:0, ph:1.5, d:1500}, top:{th:0, ph:.1, d:1500}, left:{th:-Math.PI/2+.0001, ph:1.4, d:1500}, back:{th:Math.PI, ph:1.2, d:1500}};
function setView(n){ Object.assign(state.view, VIEWS[n]); }
function camUpdate(){
  const v = state.view, c = new T3.Vector3(...[v.tx, v.tz, -v.ty]);
  // th: 方位角，0 = 从 -Y 方向看(屏幕右=+X)；π/4 = 示意图视角(从 +X,-Y 方向)
  const x = c.x + v.d*Math.sin(v.ph)*Math.sin(v.th), z = c.z + v.d*Math.sin(v.ph)*Math.cos(v.th), y = c.y + v.d*Math.cos(v.ph);
  cam.position.set(x,y,z); cam.lookAt(c);
}
function resize(){ const r = canvas.parentElement.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); cam.aspect = r.width/r.height; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(canvas.parentElement);
// 拖动旋转 / 滚轮缩放 / 右键平移
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY, pan:e.button===2||e.shiftKey}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY; const v=state.view;
  if (drag.pan) { v.tx -= dx*v.d/1100*Math.cos(v.th); v.ty += dx*v.d/1100*Math.sin(v.th)*-1; v.tz += dy*v.d/1100; }
  else { v.th -= dx*.006; v.ph = Math.min(Math.PI-.05, Math.max(.05, v.ph - dy*.006)); } });
canvas.addEventListener('pointerup', () => drag=null);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); state.view.d = Math.min(4000, Math.max(300, state.view.d*(1+e.deltaY*.001))); }, {passive:false});
// 分段高亮
const lab = {}, labBox = document.getElementById('labels');
YJ.PARTS.forEach(p => { const el = document.createElement('span'); el.className='lb'; el.textContent = p[0]; el.dataset.id = p[0]; el.title = p[1]; labBox.appendChild(el); lab[p[0]] = el; });
function inSec(parts) { return state.sec==='all' || parts.some(id => (secOf[id]||[]).includes(state.sec)); }
function applySection(){
  const col = new T3.Color(SECCOL[state.sec]||0xffffff);
  meshes.forEach(m => {
    const on = inSec(m.userData.parts), mt = m.material;
    mt.transparent = true;
    const base = new T3.Color(m.userData.base);
    if (state.sec==='all') { mt.color.copy(base); mt.emissive && mt.emissive.setHex(0x000000); mt.opacity = m.userData.op||1; }
    else if (on) { mt.color.copy(base).lerp(col,.25); mt.emissive && mt.emissive.copy(col).multiplyScalar(.28); mt.opacity = Math.max(m.userData.op||1, .9); }
    else { mt.color.copy(base).lerp(new T3.Color(0x8a949c),.7); mt.emissive && mt.emissive.setHex(0x000000); mt.opacity = .12; }
    mt.depthWrite = on || state.sec==='all' ? !(m.userData.op) : false;
  });
  machine.lines.forEach(l => { l.material.transparent = true; l.material.opacity = inSec(l.userData.parts)?1:.15; });
  Object.keys(lab).forEach(id => lab[id].classList.toggle('dim', !inSec([id])));
  document.querySelectorAll('[data-sec]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sec===state.sec)));
  window.dispatchEvent(new CustomEvent('sectionchange',{detail:state.sec}));
}
function setSection(s){ state.sec = s; applySection(); }
// 标签投影
const tmp = new T3.Vector3();
function placeLabels(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  Object.keys(lab).forEach(id => {
    const a = machine.anchors[id]; const el = lab[id];
    if (!a || !state.labels) { el.style.display='none'; return; }
    tmp.copy(W(a[0],a[1],a[2])).project(cam);
    if (tmp.z>1) { el.style.display='none'; return; }
    el.style.display=''; el.style.transform = `translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px) translate(-50%,-50%)`;
  });
}
// 主循环
let last = performance.now(), info = document.getElementById('info');
const gz = document.getElementById('gizmo');
function gizmo(){ if(!gz) return; const m=new T3.Matrix4().extractRotation(cam.matrixWorldInverse);
  [['X',[1,0,0]],['Y',[0,0,-1]],['Z',[0,1,0]]].forEach(([n,v])=>{ const q=new T3.Vector3(...v).applyMatrix4(m); const l=gz.querySelector('.g'+n), t=gz.querySelector('.t'+n);
    l.setAttribute('x2',32+q.x*22); l.setAttribute('y2',32-q.y*22); t.setAttribute('x',32+q.x*29); t.setAttribute('y',36-q.y*29); }); }
function frame(now){
  const dt = Math.min(.05,(now-last)/1000); last = now;
  if (state.playing) state.phi += dt * 2*Math.PI * state.speed;
  const r = machine.update(state.phi);
  camUpdate(); cam.updateMatrixWorld(); resize_(); renderer.render(scene, cam); placeLabels(); gizmo();
  if (info) info.textContent = `曲柄转速 ${(YJ.k.C*state.speed*60).toFixed(0)} r/min · 刀具行程 ${(2*YJ.P.stroke.e)} mm · 刀坯中心距 ${r.a.toFixed(1)} mm`;
  requestAnimationFrame(frame);
}
let sized=false; function resize_(){ if(!sized){ resize(); sized=true; } }
const bg = () => { const c = getComputedStyle(document.documentElement).getPropertyValue('--stage').trim() || '#eef1f2'; renderer.setClearColor(new T3.Color(c)); };
new MutationObserver(bg).observe(document.documentElement,{attributes:true}); matchMedia('(prefers-color-scheme: dark)').addEventListener('change',bg); bg();
// 控件
document.querySelectorAll('[data-sec]').forEach(b => b.addEventListener('click', () => setSection(b.dataset.sec)));
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.getElementById('play').addEventListener('click', e => { state.playing=!state.playing; e.currentTarget.textContent = state.playing?'暂停':'播放'; });
document.getElementById('speed').addEventListener('input', e => state.speed = parseFloat(e.target.value));
document.getElementById('lbl').addEventListener('change', e => state.labels = e.target.checked);
setView('iso'); applySection(); resize(); requestAnimationFrame(frame);
window.YJapp = {state, setSection, setView, renderer, scene, cam};
})();

/* 右侧面板：当前部分的国标运动简图、转向/传动比表、零件表 */
(function(){
const P = YJ.P, k = YJ.k, esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const AXN = {X:'+X',Y:'+Y',Z:'+Z'};
const SHAFTS = [  // [名称, 轴向, k, 所属部分]
  ['电动机轴','X',k.M,'pub'],['Ⅰ轴(带轮2、飞轮F、齿轮3)','X',k.I,'pub'],['Ⅱ轴(齿轮4、锥齿轮5a)','X',k.II,'pub'],
  ['Ⅲ轴(锥齿轮5b、蜗杆7、链轮10)','Y',k.III,'pub cut gen feed'],
  ['W轴(蜗轮7w、锥齿轮8b)','Z',k.W,'gen feed'],['Ⅳ轴(锥齿轮8a、挂轮9a、链轮19)','X',k.IV,'gen feed'],
  ['Ⅵ轴(挂轮9b、链轮11)','X',k.VI,'gen'],['箱内蜗杆轴(蜗杆11、链轮11)','X',k.VII,'gen'],['刀轴(插齿刀14、蜗轮)','Z',k.SP,'gen'],
  ['曲柄轴(曲柄12、链轮10)','Y',k.C,'cut'],['伸缩传动轴21(链轮19、曲柄21)','X',k.T,'gen feed'],['工作台(轮坯15)','Z',k.table,'gen'],
];
const FLOW = {
  pub:'电动机1 →V带2→ Ⅰ轴(带轮2、飞轮F、齿轮3) →齿轮4→ Ⅱ轴 →锥齿轮副5→ Ⅲ轴',
  cut:'Ⅲ轴 →链10→ 曲柄轴 →曲柄12、连杆→ 刀架箱体13(带刀轴、插齿刀14)上下往复',
  gen:'Ⅲ轴 →蜗杆7、蜗轮7w→ W轴 →锥齿轮8→ Ⅳ轴 ⟨刀：挂轮9→链11→蜗杆11→刀轴 · 坯：链19→伸缩轴21→蜗杆22→工作台⟩',
  feed:'Ⅳ轴 →链19→ 伸缩轴21(曲柄21) →连杆20→ 摇杆18(绕立柱17)→ 滚子16推动滑板，弹簧23回位',
};
function ratioText(sec) {
  if (sec==='gen') return `范成条件：n刀 : n坯 = z坯 : z刀 = ${P.z.zw} : ${P.z.zc}，两者转向相反（外啮合）。模型中 n刀/n电机 = ${Math.abs(k.SP).toExponential(2)}，n坯/n电机 = ${Math.abs(k.table).toExponential(2)}，比值 ${(Math.abs(k.SP/k.table)).toFixed(3)} = ${P.z.zw/P.z.zc}。`;
  if (sec==='cut') return `曲柄转速 = n电机 × ${k.C.toFixed(3)}（带 ${P.r.P2/P.r.P1} ∶ 1、齿轮 ${P.z.z3}/${P.z.z4}、链 1 ∶ 1）。刀具行程 2e = ${2*P.stroke.e} mm，连杆长 ${P.stroke.L} mm。`;
  if (sec==='feed') return `摇杆杠杆比 ${P.feed.kLever.toFixed(2)}，曲柄偏心 ${P.feed.e} mm，滑板往复幅度 ±${P.feed.amp.toFixed(2)} mm；曲柄转速 = n电机 × ${k.T.toFixed(4)}。`;
  if (sec==='pub') return `电动机 → Ⅲ轴：带 ${P.r.P2/P.r.P1} ∶ 1，齿轮 ${P.z.z3}/${P.z.z4} = ${P.z.z3/P.z.z4}，等径锥齿轮 1 ∶ 1，所以 n_Ⅲ = n电机 × ${k.III.toFixed(3)}。`;
  return '选择上方一个运动部分，查看对应的国标运动简图、各轴转向与传动比。图中数字与三维模型上的编号一致。';
}
function sense(kk, ax) { return `${kk>0?'↺ 逆时针':'↻ 顺时针'}（迎着 ${AXN[ax]} 方向看）`; }
function render(sec) {
  const dwg = document.getElementById('dwg'), tbl = document.getElementById('tbl'), note = document.getElementById('note');
  const names = YJ.SEC, parts = YJ.PARTS.filter(p => sec==='all' || p[3].split(' ').includes(sec));
  if (sec==='all') {
    dwg.innerHTML = `<h2>四个运动部分</h2><p class="sub">点击上方标签，三维模型会只高亮该部分，这里同步显示它的运动简图。</p>` +
      Object.keys(FLOW).map(s => `<p style="margin:10px 0;font-size:13.5px;line-height:1.7"><b style="color:var(--${s})">${names[s]}</b><br>${FLOW[s]}</p>`).join('');
  } else {
    const d = DWG[sec]();
    dwg.innerHTML = `<h2 style="color:var(--${sec})">${names[sec]}　机构运动简图</h2><p class="sub">GB/T 4460 机构运动简图符号 · 按空间位置正投影</p><div class="scroll"><svg viewBox="0 0 ${d.w} ${d.h}" role="img" aria-label="${names[sec]}运动简图">${d.body}</svg></div><p class="sub" style="margin-top:6px">${d.cap}</p>`;
  }
  const shafts = SHAFTS.filter(s => sec==='all' || s[3].split(' ').includes(sec));
  tbl.innerHTML = (sec==='all'?'':`<tr><th colspan="3">各轴转向（模型中的真实转向）与转速比</th></tr>` + shafts.map(s => `<tr><td colspan="2">${s[0]}　<span style="color:var(--mute)">∥${s[1]}</span></td><td>${sense(s[2],s[1])}　<span style="font-family:var(--mono)">${Math.abs(s[2]).toExponential(2)}</span></td></tr>`).join('')) +
    `<tr><th>编号</th><th>名称</th><th>类型</th></tr>` + parts.map(p => `<tr><td class="n">${p[0]}</td><td>${esc(p[1])}</td><td>${esc(p[2])}</td></tr>`).join('');
  note.innerHTML = `<b>${sec==='all'?'说明':names[sec]}</b>：${ratioText(sec)}<br>说明：转速比取示意值；零件名称由示意图和实物照片推断，编号以示意图为准。图的坐标系与三维模型相同：X 向右前，Y 向右后，Z 向上。`;
}
window.addEventListener('sectionchange', e => render(e.detail));
render('all');
})();

</script>
